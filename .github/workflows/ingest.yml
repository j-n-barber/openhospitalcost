name: Ingest (backfill / catch-up)

# Scheduled/​manual bulk ingest off the laptop (docs/CLOUD_INGEST.md, INGEST_RETRO #3).
# Processes remaining un-ingested + newly-fixed hospitals; the attempt log
# (ingest_attempts) makes it idempotent — it skips done + recently-permanent-fails.
#
# Runs weekly (refresh-stale 30) AND on manual dispatch. The weekly run no-ops
# until hospitals are >30 days stale; once they are, it refreshes ~limit/run. The
# attempt log (ingest_attempts) makes it idempotent — skips done + recent fails.
# Scheduled runs get the fallback defaults in the "Run ingest" step (dispatch
# input defaults do NOT apply to schedule events).
on:
  schedule:
    - cron: '0 7 * * 1'   # weekly — Monday 07:00 UTC (offset from Snapshots' Sunday)
  workflow_dispatch:
    inputs:
      tier:      { description: refresh_tier, type: string, default: '3' }
      limit:     { description: max hospitals this run (6h job cap), type: string, default: '800' }
      timeout:   { description: per-download timeout (s), type: string, default: '300' }
      order:     { description: beds order (asc=small-first, desc=big-first), type: choice, options: [asc, desc], default: asc }
      retry_failed: { description: re-attempt prior permanent failures, type: boolean, default: false }
      refresh_stale: { description: also re-ingest parses older than N days (0=off/backfill), type: string, default: '0' }
      no_archive:   { description: skip R2 raw archival (faster), type: boolean, default: true }
      use_tier2:    { description: enable Tier-2 Playwright fallback for blocked hosts (slower; installs Chromium), type: boolean, default: false }

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # under GitHub's 360-min hard cap
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '20', cache: 'npm' }
      - name: Install dependencies
        run: npm install
      - name: Install DuckDB CLI
        run: |
          mkdir -p .bin
          curl -fsSL https://github.com/duckdb/duckdb/releases/download/v1.5.3/duckdb_cli-linux-amd64.zip -o /tmp/duckdb.zip
          unzip -o /tmp/duckdb.zip -d .bin
          chmod +x .bin/duckdb
          .bin/duckdb --version
      - name: Install Playwright Chromium (Tier-2 only)
        if: ${{ inputs.use_tier2 }}
        run: npx playwright install --with-deps chromium
      - name: Apply migrations
        run: npm run migrate:up
      - name: Run ingest
        env:
          T: ${{ inputs.tier }}
          L: ${{ inputs.limit }}
          TO: ${{ inputs.timeout }}
          ORD: ${{ inputs.order }}
          RF: ${{ inputs.retry_failed }}
          RS: ${{ inputs.refresh_stale }}
          NA: ${{ inputs.no_archive }}
          T2: ${{ inputs.use_tier2 }}
        run: |
          # Fallbacks: scheduled runs get no dispatch inputs, so default here.
          # Weekly schedule => refresh-stale 30 (refresh month-old data, big-first),
          # Tier-1 only (T2 unset -> --no-tier2).
          T="${T:-3}"; L="${L:-800}"; TO="${TO:-300}"; ORD="${ORD:-desc}"
          RF="${RF:-false}"; NA="${NA:-true}"; RS="${RS:-30}"; T2="${T2:-false}"
          ARGS="--tier $T --limit $L --timeout $TO --order $ORD"
          [ "$T2" != "true" ] && ARGS="$ARGS --no-tier2"
          [ "$RF" = "true" ] && ARGS="$ARGS --retry-failed"
          [ "$NA" = "true" ] && ARGS="$ARGS --no-archive"
          [ "$RS" != "0" ] && [ -n "$RS" ] && ARGS="$ARGS --refresh-stale $RS"
          echo "ingest args: $ARGS"
          npm run ingest:batch -- $ARGS
