name: CI

# The project is retired down to the static case-study explainer plus a few
# static pages (see docs/CPT_LICENSING.md) — no DB, no ingestion pipeline left
# to validate. This just makes sure apps/web still builds.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
