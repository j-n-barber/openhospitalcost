name: Monthly newsletter

# Sends the monthly Hospital Price Report to newsletter subscribers by POSTing to
# the site's cron endpoint (which builds the edition from Neon and sends via
# Resend /emails/batch). The endpoint is idempotent + cap-aware: it only mails
# subscribers who haven't received the current edition, up to the per-run cap, so
# re-runs drain the remainder without duplicates. Auth via the CRON_SECRET bearer.
#
# Scheduled run = real send for the current month. Manual dispatch defaults to a
# DRY run (preview counts, send nothing) so you can check before a live send.
on:
  schedule:
    - cron: '0 14 1 * *'   # 1st of each month, 14:00 UTC (~9–10am ET)
  workflow_dispatch:
    inputs:
      dry:     { description: dry run (preview only, send nothing), type: boolean, default: true }
      edition: { description: edition key override YYYY-MM (blank = current month), type: string, default: '' }
      max:     { description: per-run send cap override (1–100, blank = env/default), type: string, default: '' }

concurrency:
  group: newsletter
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger newsletter send
        env:
          DRY: ${{ inputs.dry }}
          ED: ${{ inputs.edition }}
          MX: ${{ inputs.max }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Scheduled events carry no dispatch inputs → DRY empty → real send.
          Q=""
          [ "${DRY:-false}" = "true" ] && Q="dry=1"
          [ -n "$ED" ] && Q="${Q:+$Q&}edition=$ED"
          [ -n "$MX" ] && Q="${Q:+$Q&}max=$MX"
          URL="https://openhospitalcost.com/api/cron/newsletter${Q:+?$Q}"
          echo "POST $URL"
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST "$URL" \
            -H "Authorization: Bearer $CRON_SECRET")
          echo "HTTP $code"; cat /tmp/resp.json; echo
          # Fail the job on any non-2xx so problems are visible, not silent.
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]
